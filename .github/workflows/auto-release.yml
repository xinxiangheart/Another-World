name: Auto Release on Version Change

on:
  push:
    branches: [main]
    paths:
      - 'Assets/_Game/Scenes/Welcome.unity'

permissions:
  contents: write

jobs:
  check-and-tag:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and create tag if new
        id: detect
        shell: cmd
        run: |
          for /f "tokens=2" %%a in ('findstr /c:"currentVersion:" Assets\_Game\Scenes\Welcome.unity') do set VERSION=%%a
          echo [AutoRelease] Inspector currentVersion: %VERSION%

          git ls-remote --tags origin "v%VERSION%" | findstr /c:"refs/tags/v%VERSION%" > NUL
          if errorlevel 1 (
            echo [AutoRelease] Tag v%VERSION% not exists, creating...
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git tag v%VERSION%
            git push origin v%VERSION%
            echo TAG_CREATED=true>> %GITHUB_OUTPUT%
            echo [AutoRelease] Tag v%VERSION% pushed. Build workflow will now pick it up.
          ) else (
            echo [AutoRelease] Tag v%VERSION% already exists, skip
            echo TAG_CREATED=false>> %GITHUB_OUTPUT%
          )
          echo VERSION=%VERSION%>> %GITHUB_OUTPUT%

      - name: Write version.txt
        if: steps.detect.outputs.TAG_CREATED == 'true'
        shell: cmd
        run: echo ${{steps.detect.outputs.VERSION}}> "Assets\_Game\Resources\version.txt"

      - name: Copy Library cache
        if: steps.detect.outputs.TAG_CREATED == 'true'
        shell: cmd
        run: |
          if not exist Library mkdir Library
          xcopy "C:\Users\22589\Documents\GitHub\Another-World\Library\*" "Library\" /E /Y /Q 2>nul

      - name: Build Windows Player
        if: steps.detect.outputs.TAG_CREATED == 'true'
        shell: cmd
        run: |
          "C:\Program Files\Unity\Hub\Editor\2022.3.62f2c1\Editor\Unity.exe" -quit -batchmode -nographics -projectPath . -buildWindows64Player "build/StandaloneWindows64/Another-World.exe" -logFile build.log

      - name: Show Build Log
        if: failure()
        shell: cmd
        run: type build.log 2>nul || echo build.log not found

      - name: Zip Build
        if: steps.detect.outputs.TAG_CREATED == 'true'
        shell: cmd
        run: |
          powershell -ExecutionPolicy Bypass -Command "Compress-Archive -Path 'build\StandaloneWindows64\*' -DestinationPath Another-World-Windows.zip"

      - name: Create Release
        if: steps.detect.outputs.TAG_CREATED == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{steps.detect.outputs.VERSION}}
          files: Another-World-Windows.zip
          generate_release_notes: true
