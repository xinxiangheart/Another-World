name: Auto Release on Version Change

on:
  push:
    branches: [main]
    paths:
      - 'Assets/_Game/Scenes/Welcome.unity'

permissions:
  contents: write

jobs:
  check-and-tag:
    runs-on: self-hosted
    steps:
      # 源码从本机工作仓库同步，不再走 actions/checkout（理由同 build-release.yml：
      # 本仓库工作树约 730 MB，浅克隆在慢线路上会卡住发版）。
      - name: Sync source from local repo
        shell: cmd
        run: |
          set "SRC=C:\Users\22589\Documents\GitHub\Another-World"
          set "DST=%GITHUB_WORKSPACE%"
          if not exist "%SRC%\.git" (
            echo [ERROR] Local source repo not found: %SRC%
            exit /b 1
          )
          if not exist "%DST%" mkdir "%DST%"
          rem A shallow .git left by actions/checkout cannot be synced incrementally - rebuild it
          if exist "%DST%\.git\shallow" (
            echo [Sync] Removing shallow .git left by actions/checkout
            rmdir /s /q "%DST%\.git"
          )
          if exist "%DST%\.git\shallow" (
            echo [ERROR] Failed to remove shallow repo: %DST%\.git
            exit /b 1
          )
          if not exist "%DST%\.git" git init -q "%DST%"
          git -C "%DST%" config core.autocrlf false
          git -C "%DST%" remote remove local >nul 2>nul
          git -C "%DST%" remote add local "%SRC%"
          git -C "%DST%" fetch -q --prune --tags --force local "+refs/heads/*:refs/remotes/local/*"
          git -C "%DST%" checkout -q --force --detach %GITHUB_SHA%
          git -C "%DST%" clean -ffdxq
          git -C "%DST%" log --oneline -1

      # 建 tag 需要能推到 GitHub：origin 指向远端，并写入 actions/checkout 原本
      # 会写的那条 extraheader 凭据（默认 GITHUB_TOKEN，与改前行为一致）。
      - name: Set up origin and push credentials
        shell: cmd
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set "DST=%GITHUB_WORKSPACE%"
          git -C "%DST%" remote remove origin >nul 2>nul
          git -C "%DST%" remote add origin "https://github.com/${{ github.repository }}"
          powershell -NoProfile -Command "$b=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('x-access-token:'+$env:GH_TOKEN)); git -C '%DST%' config --local 'http.https://github.com/.extraheader' ('AUTHORIZATION: basic '+$b)"
          git -C "%DST%" config --local --get "http.https://github.com/.extraheader" >nul && echo Push credentials configured

      - name: Extract version and create tag if new
        id: detect
        shell: cmd
        run: |
          for /f "tokens=2" %%a in ('findstr /c:"currentVersion:" Assets\_Game\Scenes\Welcome.unity') do set VERSION=%%a
          echo [AutoRelease] Inspector currentVersion: %VERSION%

          git ls-remote --tags origin "v%VERSION%" | findstr /c:"refs/tags/v%VERSION%" > NUL
          if errorlevel 1 (
            echo [AutoRelease] Tag v%VERSION% not exists, creating...
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git tag v%VERSION%
            git push origin v%VERSION%
            echo TAG_CREATED=true>> %GITHUB_OUTPUT%
            echo [AutoRelease] Tag v%VERSION% pushed. Build workflow will now pick it up.
          ) else (
            echo [AutoRelease] Tag v%VERSION% already exists, skip
            echo TAG_CREATED=false>> %GITHUB_OUTPUT%
          )
          echo VERSION=%VERSION%>> %GITHUB_OUTPUT%

      - name: Write version.txt
        if: steps.detect.outputs.TAG_CREATED == 'true'
        shell: cmd
        run: echo ${{steps.detect.outputs.VERSION}}> "Assets\_Game\Resources\version.txt"

      - name: Copy Library cache
        if: steps.detect.outputs.TAG_CREATED == 'true'
        shell: cmd
        run: |
          if not exist Library mkdir Library
          xcopy "C:\Users\22589\Documents\GitHub\Another-World\Library\*" "Library\" /E /Y /Q 2>nul

      # See the same step in build-release.yml: the copied UPM state points at the local
      # checkout, so the editor would discard it and hit the broken fresh resolve.
      - name: Fix up UPM cache for this workspace
        if: steps.detect.outputs.TAG_CREATED == 'true'
        shell: powershell
        run: |
          $src = 'C:\Users\22589\Documents\GitHub\Another-World'
          $dst = $env:GITHUB_WORKSPACE
          foreach ($f in 'manifest.json', 'packages-lock.json') {
            Copy-Item (Join-Path $src "Packages\$f") (Join-Path $dst "Packages\$f") -Force
          }
          $pc = Join-Path $dst 'Library\PackageManager\ProjectCache'
          if (-not (Test-Path $pc)) {
            Write-Host '[UPM] ProjectCache not found - nothing to rewrite'
            exit 0
          }
          $text = [IO.File]::ReadAllText($pc)
          $patched = $text.Replace($src.Replace('\', '/'), $dst.Replace('\', '/')).Replace($src, $dst)
          [IO.File]::WriteAllText($pc, $patched, (New-Object Text.UTF8Encoding($false)))
          $md5 = (Get-FileHash $pc -Algorithm MD5).Hash.ToLower()
          [IO.File]::WriteAllText("$pc.md5", $md5, (New-Object Text.UTF8Encoding($false)))
          Write-Host "[UPM] ProjectCache rewritten for $dst (md5 $md5)"

      - name: Build Windows Player
        if: steps.detect.outputs.TAG_CREATED == 'true'
        shell: cmd
        run: |
          "C:\Program Files\Unity\Hub\Editor\2022.3.62f2c1\Editor\Unity.exe" -quit -batchmode -nographics -projectPath . -buildWindows64Player "build/StandaloneWindows64/Another-World.exe" -logFile build.log

      - name: Show Build Log
        if: failure()
        shell: cmd
        run: type build.log 2>nul || echo build.log not found

      - name: Zip Build
        if: steps.detect.outputs.TAG_CREATED == 'true'
        shell: cmd
        run: |
          powershell -ExecutionPolicy Bypass -Command "Compress-Archive -Path 'build\StandaloneWindows64\*' -DestinationPath Another-World-Windows.zip"

      - name: Create Release
        if: steps.detect.outputs.TAG_CREATED == 'true'
        uses: softprops/action-gh-release@v1
        env:
          NODE_OPTIONS: --use-system-ca
        with:
          tag_name: v${{steps.detect.outputs.VERSION}}
          files: Another-World-Windows.zip
          generate_release_notes: true
