name: Build and Release

# 推送 v* 标签时自动构建 Windows 包并发布到 Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Windows Player
        run: |
          "C:\Program Files\Unity\Hub\Editor\2022.3.62f2c1\Editor\Unity.exe" -quit -batchmode -nographics -buildTarget StandaloneWindows64 -buildPath build/StandaloneWindows64/Another-World.exe -projectPath . -logFile build.log
        shell: pwsh

      - name: Show Build Log (on failure)
        if: failure()
        run: |
          if (Test-Path build.log) {
            Get-Content build.log -Tail 100
          }
        shell: pwsh

      - name: Zip Build
        shell: pwsh
        run: |
          Compress-Archive -Path build/StandaloneWindows64/* -DestinationPath Another-World-Windows.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: Another-World-Windows.zip
          generate_release_notes: true
